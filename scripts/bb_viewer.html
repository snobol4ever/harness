<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byrd Box Graph — SCRIP</title>
<!--
  bb_viewer.html (v2) — Byrd Box graph viewer for SCRIP
  Self-contained, zero dependencies, works offline; double-click to open.

  Every box is the SAME size: a two-chamber rectangle with four corner ports —
  alpha in (top-left), gamma out (top-right), omega out (bottom-left),
  beta in (bottom-right).  Boxes are wired flat, port to port.

  Layouts:
    smart   (default) cycle-broken layered ranks over the operand-dispatch
            + alpha-target skeleton; barycenter crossing reduction; neighbor-
            median straightening.  The layout for real compiler dumps.
    chain   one row per statement, boxes laid in the ORDER GIVEN
            in boxes[] (= g->all[] emission order from scrip --dump-bb); adjacent
            forward/backward edges run straight through the channels; longer
            hops route orthogonally in staggered lanes above (upper-port
            events) and below (lower-port events) the row — the classic
            Byrd figure.
    force   spring embedding.

  Data: embed JSON in <script id="bb-data" type="application/json">…</script>
        (the util_bb_graph.sh injection point), drop a .json on the page, or
        Load JSON.  Demo: Proebsting Fig. 1, "5 > ((1 to 2) * (3 to 4))".

  JSON schema (SCRIP --dump-bb contract):
  {
    "meta":  { "program":"file.sno", "expr":"display title" },
    "boxes": [ { "id":"b7", "kind":"PAT_SPAN", "label":"SPAN",
                 "stmt":12, "src":"S = SPAN('0123456789')", "parent":"b3" } ],
    "edges": [ { "from":"b7", "fp":"gamma", "to":"b8", "tp":"alpha" } ]
  }
  Ports: "alpha"|"beta"|"gamma"|"omega".  Arrows leave only gamma/omega and
  arrive only at alpha/beta.  The environment is the four pseudo ids:
  "$start" (-> box alpha), "$succeed" (box gamma ->), "$fail" (box omega ->),
  "$resume" (-> box beta), rendered as labeled stubs.  Edges with rel:"op"
  are operand dispatch (parent drives child, slot = operand index): no ports,
  thin dotted gray connectors, and the smart layout's skeleton.  stmt
  (optional) groups boxes into
  rows in chain layout.  parent (optional) is kept for future grouping and
  ignored by geometry.  Edges with tp="beta" render dashed (backtrack).
-->
<style>
  :root{
    --bg:#10141c; --panel:#171c26; --panel2:#1c2230; --line:#2a3345;
    --ink:#d7dde8; --muted:#8391a8;
    --alpha:#e8edf5; --gamma:#57d99a; --omega:#ff6f6f; --beta:#5aa7f0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
       font:14px/1.45 ui-monospace,'Cascadia Code','JetBrains Mono',Menlo,Consolas,monospace}
  header{display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
         padding:9px 16px 8px; border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#141926,#10141c)}
  header h1{margin:0; font-family:Charter,Georgia,'Times New Roman',serif; font-style:italic;
            font-weight:600; font-size:18px; color:#eef2f9}
  header h1 .four{font-style:normal; font-size:14px; letter-spacing:2px; color:var(--muted)}
  #expr{color:var(--muted); font-size:13px; flex:1; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #expr b{color:var(--ink); font-weight:600}
  .bar{display:flex; gap:8px; align-items:center}
  button,.seg{background:var(--panel2); color:var(--ink); border:1px solid var(--line);
              border-radius:6px; padding:5px 11px; font:inherit; font-size:12.5px; cursor:pointer}
  button:hover{border-color:#3d4a63}
  button:focus-visible,.seg button:focus-visible{outline:2px solid var(--beta); outline-offset:1px}
  .seg{display:flex; padding:2px; gap:2px}
  .seg button{border:0; padding:3px 10px; border-radius:4px; background:transparent; color:var(--muted)}
  .seg button[aria-pressed="true"]{background:#26314a; color:var(--ink)}
  #stage{position:fixed; inset:42px 0 0 0}
  svg{width:100%; height:100%; display:block; cursor:grab}
  svg.panning{cursor:grabbing}
  #drop{position:fixed; inset:0; display:none; place-items:center; z-index:50;
        background:rgba(16,20,28,.82); border:2px dashed var(--beta); color:var(--beta); font-size:18px}
  #drop.on{display:grid}
  #details{position:fixed; right:14px; bottom:14px; max-width:380px; max-height:42vh; overflow:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:8px;
           padding:10px 12px; font-size:12px; display:none; box-shadow:0 8px 30px rgba(0,0,0,.45)}
  #details.on{display:block}
  #details h3{margin:0 0 6px; font-size:12.5px; color:var(--gamma); font-weight:600}
  #details pre{margin:0; white-space:pre-wrap; color:var(--muted)}
  #details .x{float:right; cursor:pointer; color:var(--muted); border:0; background:none; padding:0 2px}
  @media (max-width:760px){ header{gap:10px} #expr{display:none} }
</style>
</head>
<body>
<header>
  <h1>Byrd&nbsp;Box&nbsp;Graph <span class="four">α&thinsp;β&thinsp;γ&thinsp;ω</span></h1>
  <div id="expr"></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Layout">
      <button data-layout="smart"   aria-pressed="true">smart</button>
      <button data-layout="chain"   aria-pressed="false">chain</button>
      <button data-layout="force"   aria-pressed="false">force</button>
    </div>
    <button id="fit">Fit</button>
    <button id="load">Load JSON</button>
    <button id="export">Export SVG</button>
    <button id="demo" title="Restore the built-in Proebsting example">Demo</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>

<div id="stage">
<svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Byrd Box graph">
  <style>
    .gridDot{fill:#1c2331}
    .box .body{fill:url(#boxg); stroke:#3b485f; stroke-width:1.1}
    .box .divider{stroke:#0c0f16; stroke-width:1}
    .box .kind{fill:#e9eef7; font:600 11.5px ui-monospace,Menlo,Consolas,monospace; text-anchor:middle}
    .box .sub{fill:#7f8ca3; font:9px ui-monospace,Menlo,Consolas,monospace; text-anchor:middle}
    .port{stroke:#0c0f16; stroke-width:.8}
    .port.alpha{fill:#e8edf5} .port.gamma{fill:#57d99a}
    .port.omega{fill:#ff6f6f} .port.beta{fill:#5aa7f0}
    .rowlbl{fill:#5f6c84; font:italic 11px Georgia,serif}
    .edge{fill:none; stroke-width:1.4; opacity:.92}
    .edge.alpha{stroke:#e8edf5} .edge.gamma{stroke:#57d99a}
    .edge.omega{stroke:#ff6f6f} .edge.beta{stroke:#5aa7f0}
    .edge.back{stroke-dasharray:5 4; opacity:.85}
    .edge.op{stroke:#5b6880; stroke-width:1; stroke-dasharray:2 3; opacity:.55}
    svg.focus .edge.op.lit{stroke-width:1.4; opacity:.95}
    .hud .lg{fill:#171c26cc; stroke:#2a3345}
    .hud text{font:11px ui-monospace,Menlo,Consolas,monospace; fill:#8391a8}
    .hud .t{fill:#d7dde8; font-weight:600}
    .hud .plabel{font:italic 600 11px Georgia,serif}
    .extlbl{font:italic 12px Georgia,serif}
    .hoverGreek text{font:italic 600 11px Georgia,serif; paint-order:stroke; stroke:#10141c; stroke-width:3}
    svg.focus .edge{opacity:.08} svg.focus .edge.lit{opacity:1; stroke-width:2}
    svg.focus .box{opacity:.20} svg.focus .box.lit{opacity:1}
    .box{cursor:pointer}
    @media (prefers-reduced-motion: no-preference){
      .edge{transition:opacity .12s} .box{transition:opacity .12s}
    }
  </style>
  <defs>
    <linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#232c3d"/><stop offset=".5" stop-color="#232c3d"/>
      <stop offset=".5" stop-color="#171e2b"/><stop offset="1"  stop-color="#171e2b"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle class="gridDot" cx="1" cy="1" r="1"/>
    </pattern>
    <marker id="m-alpha" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8edf5"/></marker>
    <marker id="m-gamma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57d99a"/></marker>
    <marker id="m-omega" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6f6f"/></marker>
    <marker id="m-op" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6880"/></marker>
    <marker id="m-beta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5aa7f0"/></marker>
  </defs>
  <rect x="-100000" y="-100000" width="200000" height="200000" fill="url(#grid)"/>
  <g id="world">
    <g id="edges"></g>
    <g id="ext"></g>
    <g id="nodes"></g>
    <g id="hover" class="hoverGreek"></g>
  </g>
  <g id="hud" class="hud"></g>
</svg>
</div>

<div id="drop">drop a BB graph .json</div>
<div id="details"><button class="x" aria-label="Close">✕</button><h3 id="d-title"></h3><pre id="d-body"></pre></div>

<script id="bb-data" type="application/json"></script>
<script>
"use strict";
/* ================= PART A — pure model, layouts, routing (node-testable) ================= */

const GREEK = { alpha:"α", beta:"β", gamma:"γ", omega:"ω" };
const LEFT  = { alpha:1, omega:1 };            // ports on the left face
const UPPER = { alpha:1, gamma:1 };            // ports on the upper half
const BOX   = { w:100, h:40 };                 // every box, always
const CH    = { gap:58, wrap:30, lane:13, lanePad:20, rowPad:26, stub:12, r:8 };
const EXTLEN= 64;                              // external stub length

const DEMO = {
  meta: { program:"proebsting-fig1",
          expr:"5 > ((1 to\u2081 2) * (3 to\u2082 4)) \u2014 Proebsting 1997, branch-chained" },
  boxes: [
    { id:"l5",  kind:"5",        label:"lit" },
    { id:"l1",  kind:"1",        label:"lit" },
    { id:"l2",  kind:"2",        label:"lit" },
    { id:"to1", kind:"to\u2081", label:"to" },
    { id:"l3",  kind:"3",        label:"lit" },
    { id:"l4",  kind:"4",        label:"lit" },
    { id:"to2", kind:"to\u2082", label:"to" },
    { id:"mult",kind:"*",        label:"mult" },
    { id:"gt",  kind:">",        label:"greater" }
  ],
  edges: [
    { from:"$start", to:"l5",  tp:"alpha" },
    { from:"l5",  fp:"gamma", to:"l1",  tp:"alpha" },
    { from:"l1",  fp:"gamma", to:"l2",  tp:"alpha" },
    { from:"l2",  fp:"gamma", to:"to1", tp:"alpha" },
    { from:"to1", fp:"gamma", to:"l3",  tp:"alpha" },
    { from:"l3",  fp:"gamma", to:"l4",  tp:"alpha" },
    { from:"l4",  fp:"gamma", to:"to2", tp:"alpha" },
    { from:"to2", fp:"gamma", to:"mult",tp:"alpha" },
    { from:"mult",fp:"gamma", to:"gt",  tp:"alpha" },
    { from:"gt",  fp:"gamma", to:"$succeed" },
    { from:"l5",  fp:"omega", to:"$fail" },
    { from:"l1",  fp:"omega", to:"l5",  tp:"beta" },
    { from:"l2",  fp:"omega", to:"l1",  tp:"beta" },
    { from:"to1", fp:"omega", to:"l2",  tp:"beta", note:"I exceeds bound: ask E\u2082 for the next" },
    { from:"l3",  fp:"omega", to:"to1", tp:"beta" },
    { from:"l4",  fp:"omega", to:"l3",  tp:"beta" },
    { from:"to2", fp:"omega", to:"l4",  tp:"beta", note:"I exceeds bound: ask E\u2082 for the next" },
    { from:"mult",fp:"omega", to:"to2", tp:"beta", note:"another product wanted: resume E\u2082" },
    { from:"gt",  fp:"omega", to:"mult",tp:"beta", note:"5 \u2265 value: try the next product" },
    { from:"$resume", to:"gt", tp:"beta", note:"environment asks for another solution" }
  ]
};

function buildGraph(data){
  const G = { meta:data.meta||{}, nodes:new Map(), edges:[], ext:[], ops:[], order:[] };
  for (const b of data.boxes||[]){
    if (!b || b.id==null) continue;
    const id = String(b.id);
    G.nodes.set(id, { id, kind:String(b.kind??id), label:b.label?String(b.label):"",
      stmt:b.stmt, src:b.src, parent:b.parent!=null?String(b.parent):null, raw:b,
      x:0, y:0, w:BOX.w, h:BOX.h, col:0, row:0 });
    G.order.push(id);
  }
  for (const e of data.edges||[]){
    const fid=String(e.from??""), tid=String(e.to??"");
    if (e.rel==="op"){
      const a=G.nodes.get(fid), b=G.nodes.get(tid);
      if (a && b && !G.ops.some(o=>o.a===a&&o.b===b)) G.ops.push({a,b,slot:e.slot|0});
      continue;
    }
    if (fid[0]==="$" || tid[0]==="$"){                  // external sentinel: $start $succeed $fail $resume
      const into = fid[0]==="$";
      const n = G.nodes.get(into?tid:fid);
      const port = into ? (e.tp||"alpha") : (e.fp||"gamma");
      if (n && GREEK[port]) G.ext.push({ n, port, into, kind:(into?fid:tid).slice(1),
                                         note:e.note?String(e.note):"" });
      continue;
    }
    const a=G.nodes.get(fid), b=G.nodes.get(tid);
    if (!a||!b||!GREEK[e.fp]||!GREEK[e.tp]) continue;
    G.edges.push({ a, b, fp:e.fp, tp:e.tp, note:e.note?String(e.note):"" });
  }
  return G;
}

function portXY(n,p){
  const uy=n.y+n.h/4, ly=n.y+3*n.h/4;
  switch(p){
    case "alpha": return {x:n.x,     y:uy};
    case "gamma": return {x:n.x+n.w, y:uy};
    case "omega": return {x:n.x,     y:ly};
    case "beta":  return {x:n.x+n.w, y:ly};
  }
}

/* ---- chain layout: boxes[] order verbatim (= g->all[] emission order), one row per stmt ---- */
function layoutChain(G){
  const order=G.order.map(id=>G.nodes.get(id));
  const rowsByKey=new Map(), rows=[];
  for (const n of order){
    const key = n.stmt!=null ? "s"+n.stmt : "\u00b7";
    let row = rowsByKey.get(key);
    if (!row || row.list.length>=CH.wrap){
      row = { key, stmt:n.stmt, list:[], top:0, bot:0, y:0 };
      rowsByKey.set(key,row); rows.push(row);
    }
    n.row=rows.indexOf(row); n.col=row.list.length; row.list.push(n);
    n.x = n.col*(BOX.w+CH.gap);
  }
  const ctx={ rows, lane:new Map() };                   // edge -> {side,laneY}
  for (const row of rows){                              // lane assignment per row+side
    for (const side of ["top","bot"]){
      const cand=[];
      for (const e of G.edges){
        if (e.a.row!==rows.indexOf(row) || e.b.row!==e.a.row) continue;
        if (chainStyle(e)!=="lane") continue;
        if ((side==="top") !== !!UPPER[e.fp]) continue;
        const x1=e.a.x+(LEFT[e.fp]?-CH.stub:BOX.w+CH.stub);
        const x2=e.b.x+(LEFT[e.tp]?-CH.stub:BOX.w+CH.stub);
        cand.push({ e, lo:Math.min(x1,x2)-6, hi:Math.max(x1,x2)+6 });
      }
      cand.sort((p,q)=>p.lo-q.lo || (q.hi-q.lo)-(p.hi-p.lo));
      const laneEnd=[];                                 // greedy interval packing
      for (const c of cand){
        let k=0; while (k<laneEnd.length && laneEnd[k]>c.lo) k++;
        laneEnd[k]=c.hi; ctx.lane.set(c.e,{side,idx:k});
        if (side==="top") row.top=Math.max(row.top,k+1); else row.bot=Math.max(row.bot,k+1);
      }
    }
  }
  let y=0;
  for (const row of rows){
    y += CH.rowPad + row.top*CH.lane + (row.top?CH.lanePad-CH.lane:0);
    row.y=y;
    for (const n of row.list) n.y=y;
    y += BOX.h + row.bot*CH.lane + (row.bot?CH.lanePad-CH.lane:0) + CH.rowPad;
  }
  for (const [e,l] of ctx.lane){
    const row=ctx.rows[e.a.row];
    l.y = l.side==="top" ? row.y - CH.lanePad - l.idx*CH.lane
                         : row.y + BOX.h + CH.lanePad + l.idx*CH.lane;
  }
  return ctx;
}
function chainStyle(e){
  if (e.a===e.b) return "loop";
  if (e.a.row!==e.b.row) return "soft";
  const p=portXY(e.a,e.fp), q=portXY(e.b,e.tp);
  const straightF = !LEFT[e.fp] &&  LEFT[e.tp] && e.b.col===e.a.col+1 && p.y===q.y;
  const straightB =  LEFT[e.fp] && !LEFT[e.tp] && e.b.col===e.a.col-1 && p.y===q.y;
  if (straightF||straightB) return "straight";
  if (!!UPPER[e.fp] !== !!UPPER[e.tp]) return "soft";
  return "lane";
}
function rpath(pts,r){
  let d=`M${pts[0].x},${pts[0].y}`;
  for (let i=1;i<pts.length-1;i++){
    const a=pts[i-1], b=pts[i], c=pts[i+1];
    const l1=Math.hypot(b.x-a.x,b.y-a.y), l2=Math.hypot(c.x-b.x,c.y-b.y);
    const rr=Math.min(r,l1/2,l2/2);
    const u1={x:(b.x-a.x)/(l1||1),y:(b.y-a.y)/(l1||1)}, u2={x:(c.x-b.x)/(l2||1),y:(c.y-b.y)/(l2||1)};
    d+=` L${b.x-u1.x*rr},${b.y-u1.y*rr} Q${b.x},${b.y} ${b.x+u2.x*rr},${b.y+u2.y*rr}`;
  }
  const z=pts[pts.length-1];
  return d+` L${z.x},${z.y}`;
}
function edgePathChain(G,ctx,e){
  const p=portXY(e.a,e.fp), q=portXY(e.b,e.tp);
  const style=chainStyle(e);
  if (style==="straight") return `M${p.x},${p.y} L${q.x},${q.y}`;
  if (style==="loop"){
    const bulge=p.x+CH.stub+8;
    return rpath([p,{x:bulge,y:p.y},{x:bulge,y:q.y},q],CH.r+1);
  }
  if (style==="soft") return edgePathSoft(e);
  const l=ctx.lane.get(e);
  const sx=p.x+(LEFT[e.fp]?-1:1)*(CH.stub+l.idx*3);
  const ex=q.x+(LEFT[e.tp]?-1:1)*(CH.stub+l.idx*3);
  return rpath([p,{x:sx,y:p.y},{x:sx,y:l.y},{x:ex,y:l.y},{x:ex,y:q.y},q],CH.r);
}
function edgePathSoft(e){
  const p=portXY(e.a,e.fp), q=portXY(e.b,e.tp);
  const o1=LEFT[e.fp]?-1:1, o2=LEFT[e.tp]?-1:1;
  const span=Math.max(30,Math.abs(q.x-p.x)*0.4,Math.abs(q.y-p.y)*0.5);
  const sag=e.tp==="beta"?16+Math.min(40,Math.abs(q.x-p.x)*0.08):0;
  return `M${p.x},${p.y} C${p.x+o1*span},${p.y+sag} ${q.x+o2*span},${q.y+sag} ${q.x},${q.y}`;
}

/* ---- smart layout: cycle-broken ranks over dispatch+alpha skeleton ---- */
function layoutSmart(G){
  const ns=[...G.nodes.values()];
  if (!ns.length) return;
  for (const n of ns) n.rank=0;
  const S=[];
  for (const o of G.ops) S.push({a:o.a,b:o.b,back:0});
  for (const e of G.edges) if (e.tp==="alpha") S.push({a:e.a,b:e.b,back:0});
  const adj=new Map(ns.map(n=>[n,[]]));
  for (const sk of S) adj.get(sk.a).push(sk);
  const state=new Map(ns.map(n=>[n,0]));
  const hasIn=new Set(S.map(sk=>sk.b));
  const roots=[...G.ext.filter(x=>x.into&&x.port==="alpha").map(x=>x.n),
               ...ns.filter(n=>!hasIn.has(n)), ...ns];
  for (const r of roots){
    if (state.get(r)) continue;
    const st=[{n:r,i:0}]; state.set(r,1);
    while (st.length){
      const fr=st[st.length-1], es=adj.get(fr.n);
      if (fr.i>=es.length){ state.set(fr.n,2); st.pop(); continue; }
      const sk=es[fr.i++];
      if (state.get(sk.b)===1){ sk.back=1; continue; }
      if (state.get(sk.b)===0){ state.set(sk.b,1); st.push({n:sk.b,i:0}); }
    }
  }
  const keep=S.filter(sk=>!sk.back);
  for (let k=0;k<ns.length;k++){
    let m=false;
    for (const sk of keep) if (sk.b.rank<sk.a.rank+1){ sk.b.rank=sk.a.rank+1; m=true; }
    if (!m) break;
  }
  const cols=new Map();
  for (const n of ns){ if(!cols.has(n.rank)) cols.set(n.rank,[]); cols.get(n.rank).push(n); }
  const ranks=[...cols.keys()].sort((a,b)=>a-b);
  const NB=new Map(ns.map(n=>[n,[]]));
  for (const e of G.edges){ NB.get(e.a).push(e.b); NB.get(e.b).push(e.a); }
  for (const o of G.ops){ NB.get(o.a).push(o.b); NB.get(o.b).push(o.a); }
  cols.forEach(c=>c.forEach((n,i)=>n.oy=i));
  for (let sweep=0; sweep<8; sweep++){
    for (const r of (sweep%2? [...ranks].reverse() : ranks)){
      const col=cols.get(r);
      for (const n of col){
        const nb=NB.get(n).filter(m2=>m2.rank!==r);
        n.bary=nb.length? nb.reduce((s2,m2)=>s2+m2.oy,0)/nb.length : n.oy;
      }
      col.sort((p,q)=>p.bary-q.bary||p.oy-q.oy);
      col.forEach((n,i)=>n.oy=i);
    }
  }
  const GX=104, GY=26;
  for (const r of ranks){
    const col=cols.get(r);
    let y=-(col.length*(BOX.h+GY)-GY)/2;
    for (const n of col){ n.x=r*(BOX.w+GX); n.y=y; y+=BOX.h+GY; }
  }
  for (let p=0;p<6;p++){
    for (const r of (p%2? [...ranks].reverse() : ranks)){
      const col=cols.get(r);
      for (const n of col){
        const nb=NB.get(n).filter(m2=>m2.rank!==r);
        n.dy=nb.length? nb.reduce((s2,m2)=>s2+m2.y,0)/nb.length : n.y;
      }
      col.sort((a,b)=>a.oy-b.oy);
      let prev=-1e15;
      for (const n of col){ n.y=Math.max(n.dy, prev+BOX.h+GY); prev=n.y; }
      const drift=col.reduce((s2,n)=>s2+(n.dy-n.y),0)/col.length;
      for (const n of col) n.y+=drift;
    }
  }
}
function edgePathOp(o){
  const p={x:o.a.x+o.a.w,y:o.a.y+o.a.h/2}, q={x:o.b.x,y:o.b.y+o.b.h/2};
  const sp=Math.max(24,Math.abs(q.x-p.x)*0.4,Math.abs(q.y-p.y)*0.35);
  return `M${p.x},${p.y} C${p.x+sp},${p.y} ${q.x-sp},${q.y} ${q.x},${q.y}`;
}
/* ---- force ---- */
function forceTick(G,k){
  const ns=[...G.nodes.values()];
  for (const n of ns){ n.fx=0; n.fy=0; }
  for (let i=0;i<ns.length;i++) for (let j=i+1;j<ns.length;j++){
    const a=ns[i],b=ns[j];
    let dx=(a.x-b.x),dy=(a.y-b.y),d2=dx*dx+dy*dy||1,d=Math.sqrt(d2),rep=30000/d2;
    dx/=d;dy/=d; a.fx+=dx*rep;a.fy+=dy*rep;b.fx-=dx*rep;b.fy-=dy*rep;
  }
  const spring=(a,b,rest,kk)=>{
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1,f=(d-rest)*kk;
    dx/=d;dy/=d; a.fx+=dx*f*d;a.fy+=dy*f*d;b.fx-=dx*f*d;b.fy-=dy*f*d;
  };
  for (const e of G.edges) spring(e.a,e.b,200,0.014);
  for (const o of G.ops)  spring(o.a,o.b,170,0.02);
  for (const e of G.edges) if (e.tp==="alpha" && e.b.x<e.a.x+BOX.w+40){ e.a.fx-=90; e.b.fx+=90; }
  for (const o of G.ops) if (o.b.x<o.a.x+BOX.w+40){ o.a.fx-=90; o.b.fx+=90; }
  for (const n of ns){
    if (n.pinned) continue;
    n.vx=((n.vx||0)+n.fx*k)*0.82; n.vy=((n.vy||0)+n.fy*k)*0.82;
    n.x+=Math.max(-22,Math.min(22,n.vx)); n.y+=Math.max(-22,Math.min(22,n.vy));
  }
}
function worldBBox(G,ctx){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const n of G.nodes.values()){
    x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+n.w);y1=Math.max(y1,n.y+n.h);
  }
  if (ctx) for (const l of ctx.lane.values()){ y0=Math.min(y0,l.y-8); y1=Math.max(y1,l.y+8); }
  for (const x of G.ext||[]){
    const c=portXY(x.n,x.port), dir=LEFT[x.port]?-1:1, tip=c.x+dir*(EXTLEN+58);
    x0=Math.min(x0,tip); x1=Math.max(x1,tip);
    y0=Math.min(y0,c.y-10); y1=Math.max(y1,c.y+10);
  }
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}

/* ================= PART B — DOM ================= */
function boot(){
  const $=s=>document.querySelector(s);
  const svg=$("#svg"), world=$("#world"), gE=$("#edges"), gN=$("#nodes"),
        gH=$("#hover"), hud=$("#hud");
  const NS="http://www.w3.org/2000/svg";
  const el=(t,attrs,parent)=>{ const k=document.createElementNS(NS,t);
    for (const a in attrs) k.setAttribute(a,attrs[a]); if(parent) parent.appendChild(k); return k; };
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  let G=null, mode="smart", chainCtx=null, view={x:60,y:80,k:1}, raf=0, pinned=null;
  let _ctx=null;
  const textW=(s,px)=>{ if(!_ctx)_ctx=document.createElement("canvas").getContext("2d");
    _ctx.font="600 "+px+"px ui-monospace, Menlo, Consolas, monospace"; return _ctx.measureText(s).width; };
  const clip=(s,px,max)=>{ if(textW(s,px)<=max) return s;
    while (s.length>1 && textW(s+"\u2026",px)>max) s=s.slice(0,-1); return s+"\u2026"; };

  function loadData(data,name){
    try{ G=buildGraph(data); }catch(err){ alert("Could not read graph: "+err.message); return; }
    $("#expr").innerHTML="<b>"+esc(G.meta.expr||G.meta.program||name||"graph")+"</b>"
      +"&nbsp;·&nbsp;"+G.nodes.size+" boxes · "+G.edges.length+" edges";
    applyLayout(mode,true);
  }

  function applyLayout(name,refit){
    mode=name; cancelAnimationFrame(raf);
    document.querySelectorAll(".seg button").forEach(b=>
      b.setAttribute("aria-pressed", b.dataset.layout===name));
    chainCtx=null;
    if (name==="chain") chainCtx=layoutChain(G);
    else layoutSmart(G);
    render();
    if (name==="force"){
      const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce){ for(let i=0;i<260;i++) forceTick(G,Math.max(.02,.35*(1-i/260))); redrawGeom(); }
      else { let t=0; const step=()=>{ forceTick(G,Math.max(.02,.35*(1-t/260)));
             redrawGeom(); if(++t<260) raf=requestAnimationFrame(step); }; step(); }
    }
    if (refit) fit();
  }

  function pathFor(e){ return mode==="chain" ? edgePathChain(G,chainCtx,e) : edgePathSoft(e); }

  const gX=$("#ext");
  function drawExt(){
    gX.textContent="";
    const pc={alpha:"#e8edf5",gamma:"#57d99a",omega:"#ff6f6f",beta:"#5aa7f0"};
    for (const x of G.ext){
      const c=portXY(x.n,x.port), dir=LEFT[x.port]?-1:1, tip={x:c.x+dir*EXTLEN,y:c.y};
      const d = x.into ? `M${tip.x},${tip.y} L${c.x+dir*7},${c.y}`
                       : `M${c.x},${c.y} L${tip.x},${tip.y}`;
      x.el=el("path",{class:"edge "+x.port+(x.port==="beta"?" back":""),d,
                      "marker-end":"url(#m-"+x.port+")"},gX);
      const tt=el("title",{},x.el);
      tt.textContent=(x.into?("$"+x.kind+" \u2192 "+x.n.id+"."+GREEK[x.port])
                            :(x.n.id+"."+GREEK[x.port]+" \u2192 $"+x.kind))
                     +(x.note?"\n"+x.note:"");
      const lbl=el("text",{class:"extlbl",x:tip.x+dir*8,y:tip.y+4,fill:pc[x.port],
                           "text-anchor":dir>0?"start":"end"},gX);
      lbl.textContent=x.kind;
    }
  }

  function render(){
    gE.textContent=""; gN.textContent=""; gH.textContent=""; unlight(); pinned=null;
    if (mode==="chain")
      for (const row of chainCtx.rows) if (row.stmt!=null && row.list.length){
        const t=el("text",{class:"rowlbl",x:row.list[0].x-16,y:row.y+BOX.h/2+4,
                           "text-anchor":"end"},gN);
        t.textContent="stmt "+row.stmt;
      }
    for (const n of G.nodes.values()){
      const g=el("g",{class:"box","data-id":n.id},gN); n.el=g;
      el("rect",{class:"body",x:n.x,y:n.y,width:n.w,height:n.h,rx:6},g);
      el("line",{class:"divider",x1:n.x,y1:n.y+n.h/2,x2:n.x+n.w,y2:n.y+n.h/2},g);
      const kt=el("text",{class:"kind",x:n.x+n.w/2,y:n.y+n.h/4+4},g);
      kt.textContent=clip(n.kind,11.5,n.w-22);
      const st=el("text",{class:"sub",x:n.x+n.w/2,y:n.y+3*n.h/4+3},g);
      st.textContent=clip((n.label?n.label+" ":"")+n.id,9,n.w-18);
      for (const p of ["alpha","gamma","omega","beta"]){
        const c=portXY(n,p);
        el("circle",{class:"port "+p,cx:c.x,cy:c.y,r:3.4},g);
      }
      const tt=el("title",{},g);
      tt.textContent=n.id+" \u2014 "+n.kind+(n.label?" ("+n.label+")":"")
        +(n.stmt!=null?"\nstmt "+n.stmt:"")+(n.src?"\n"+n.src:"");
      wireBox(g,n);
    }
    for (const o of G.ops){
      o.el=el("path",{class:"edge op",d:edgePathOp(o),"marker-end":"url(#m-op)"},gE);
      const ot=el("title",{},o.el);
      ot.textContent=o.a.id+" \u2192 "+o.b.id+"  (operand "+o.slot+")";
    }
    for (const e of G.edges){
      e.el=el("path",{class:"edge "+e.fp+(e.tp==="beta"?" back":""),
                      d:pathFor(e),"marker-end":"url(#m-"+e.fp+")"},gE);
      const tt=el("title",{},e.el);
      tt.textContent=e.a.id+"."+GREEK[e.fp]+" \u2192 "+e.b.id+"."+GREEK[e.tp]
        +(e.note?"\n"+e.note:"");
    }
    drawExt();
    drawHUD();
  }

  function redrawGeom(){
    for (const n of G.nodes.values()){
      const g=n.el; if(!g) continue;
      g.querySelector(".body").setAttribute("x",n.x);
      g.querySelector(".body").setAttribute("y",n.y);
      const d=g.querySelector(".divider");
      d.setAttribute("x1",n.x);d.setAttribute("x2",n.x+n.w);
      d.setAttribute("y1",n.y+n.h/2);d.setAttribute("y2",n.y+n.h/2);
      const ts=g.querySelectorAll("text");
      ts[0].setAttribute("x",n.x+n.w/2); ts[0].setAttribute("y",n.y+n.h/4+4);
      ts[1].setAttribute("x",n.x+n.w/2); ts[1].setAttribute("y",n.y+3*n.h/4+3);
      const cs=g.querySelectorAll("circle.port"), order=["alpha","gamma","omega","beta"];
      cs.forEach((c,i)=>{ const p=portXY(n,order[i]);
        c.setAttribute("cx",p.x); c.setAttribute("cy",p.y); });
    }
    for (const e of G.edges) e.el.setAttribute("d",pathFor(e));
    for (const o of G.ops) o.el&&o.el.setAttribute("d",edgePathOp(o));
    drawExt();
  }

  function drawHUD(){
    hud.textContent="";
    const x=14,y=14,w=250,h=104;
    el("rect",{class:"lg",x,y,width:w,height:h,rx:8},hud);
    const bx=x+14,by=y+26,bw=62,bh=36;
    el("rect",{x:bx,y:by,width:bw,height:bh,rx:5,fill:"#232c3d",stroke:"#3b485f"},hud);
    el("line",{x1:bx,y1:by+bh/2,x2:bx+bw,y2:by+bh/2,stroke:"#0c0f16"},hud);
    const P={alpha:[bx,by+bh/4],gamma:[bx+bw,by+bh/4],omega:[bx,by+3*bh/4],beta:[bx+bw,by+3*bh/4]};
    const pc={alpha:"#e8edf5",gamma:"#57d99a",omega:"#ff6f6f",beta:"#5aa7f0"};
    for (const p in P){
      el("circle",{class:"port "+p,cx:P[p][0],cy:P[p][1],r:3.6},hud);
      const t=el("text",{class:"plabel",x:P[p][0]+(LEFT[p]?-9:9),y:P[p][1]+4,
        fill:pc[p],"text-anchor":LEFT[p]?"end":"start"},hud);
      t.textContent=GREEK[p];
    }
    const tt=el("text",{class:"t",x:x+104,y:y+32},hud); tt.textContent="the Byrd box";
    const l1=el("text",{x:x+104,y:y+50},hud); l1.textContent="\u03b1 start \u00b7 \u03b3 succeed";
    const l2=el("text",{x:x+104,y:y+66},hud); l2.textContent="\u03c9 fail \u00b7 \u03b2 resume";
    const l3=el("text",{x:x+14,y:y+92},hud);
    l3.textContent="solid fwd \u00b7 dashed back \u00b7 dotted gray dispatch";
  }

  /* ---- interaction ---- */
  function wireBox(g,n){
    g.addEventListener("pointerenter",()=>{ if(!pinned){ light(n); greek(n); }});
    g.addEventListener("pointerleave",()=>{ if(!pinned){ unlight(); gH.textContent=""; }});
    g.addEventListener("click",ev=>{ ev.stopPropagation();
      if (pinned===n){ pinned=null; unlight(); gH.textContent="";
                       $("#details").classList.remove("on"); return; }
      pinned=n; light(n); greek(n); showDetails(n); });
    g.addEventListener("pointerdown",ev=>{
      if (ev.button!==0 || mode==="chain") return;      // chain routing is deterministic
      ev.stopPropagation();
      const s={mx:ev.clientX,my:ev.clientY,x:n.x,y:n.y};
      n.pinned=true;
      const move=e2=>{ n.x=s.x+(e2.clientX-s.mx)/view.k; n.y=s.y+(e2.clientY-s.my)/view.k; redrawGeom(); };
      const up=()=>{ n.pinned=false; removeEventListener("pointermove",move); removeEventListener("pointerup",up); };
      addEventListener("pointermove",move); addEventListener("pointerup",up);
    });
  }
  function greek(n){
    gH.textContent="";
    const pc={alpha:"#e8edf5",gamma:"#57d99a",omega:"#ff6f6f",beta:"#5aa7f0"};
    for (const p of ["alpha","gamma","omega","beta"]){
      const c=portXY(n,p);
      const t=el("text",{x:c.x+(LEFT[p]?-8:8),y:c.y+4,fill:pc[p],
        "text-anchor":LEFT[p]?"end":"start"},gH);
      t.textContent=GREEK[p];
    }
  }
  function light(n){
    svg.classList.add("focus");
    for (const e of G.edges) e.el.classList.toggle("lit",e.a===n||e.b===n);
    for (const m of G.nodes.values()) m.el.classList.remove("lit");
    n.el.classList.add("lit");
    for (const e of G.edges) if (e.a===n||e.b===n){
      e.a.el.classList.add("lit"); e.b.el.classList.add("lit"); }
    for (const x of G.ext) x.el&&x.el.classList.toggle("lit",x.n===n);
    for (const o of G.ops) o.el&&o.el.classList.toggle("lit",o.a===n||o.b===n);
  }
  function unlight(){
    svg.classList.remove("focus");
    if (!G) return;
    for (const e of G.edges) e.el&&e.el.classList.remove("lit");
    for (const m of G.nodes.values()) m.el&&m.el.classList.remove("lit");
    for (const x of G.ext) x.el&&x.el.classList.remove("lit");
    for (const o of G.ops) o.el&&o.el.classList.remove("lit");
  }
  function showDetails(n){
    $("#d-title").textContent=n.id+" \u00b7 "+n.kind;
    const inc=G.edges.filter(e=>e.a===n||e.b===n)
      .map(e=>"  "+e.a.id+"."+GREEK[e.fp]+" \u2192 "+e.b.id+"."+GREEK[e.tp]
              +(e.note?"   ("+e.note+")":"")).join("\n");
    $("#d-body").textContent=JSON.stringify(n.raw,null,1).replace(/[{}"]/g,"")
      +"\nedges:\n"+inc;
    $("#details").classList.add("on");
  }
  $("#details .x").addEventListener("click",()=>{
    $("#details").classList.remove("on"); pinned=null; unlight(); gH.textContent=""; });

  /* ---- pan / zoom / fit ---- */
  const applyView=()=>world.setAttribute("transform",
    `translate(${view.x},${view.y}) scale(${view.k})`);
  svg.addEventListener("wheel",ev=>{
    ev.preventDefault();
    const f=Math.exp(-ev.deltaY*0.0014), k=Math.max(.05,Math.min(6,view.k*f));
    const r=svg.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
    view.x=mx-(mx-view.x)*(k/view.k); view.y=my-(my-view.y)*(k/view.k); view.k=k; applyView();
  },{passive:false});
  svg.addEventListener("pointerdown",ev=>{
    if (ev.button!==0) return;
    svg.classList.add("panning");
    const s={mx:ev.clientX,my:ev.clientY,x:view.x,y:view.y};
    const move=e2=>{ view.x=s.x+(e2.clientX-s.mx); view.y=s.y+(e2.clientY-s.my); applyView(); };
    const up=()=>{ svg.classList.remove("panning");
      removeEventListener("pointermove",move); removeEventListener("pointerup",up); };
    addEventListener("pointermove",move); addEventListener("pointerup",up);
  });
  svg.addEventListener("click",()=>{ if(pinned){ pinned=null; unlight(); gH.textContent="";
    $("#details").classList.remove("on"); }});
  function fit(){
    const b=worldBBox(G,chainCtx), r=svg.getBoundingClientRect(), m=70;
    const k=Math.min((r.width-2*m)/Math.max(1,b.w),(r.height-2*m)/Math.max(1,b.h),1.8);
    view.k=k; view.x=(r.width-b.w*k)/2-b.x*k; view.y=(r.height-b.h*k)/2-b.y*k; applyView();
  }

  /* ---- chrome ---- */
  document.querySelectorAll(".seg button").forEach(b=>
    b.addEventListener("click",()=>applyLayout(b.dataset.layout,true)));
  $("#fit").addEventListener("click",fit);
  $("#load").addEventListener("click",()=>$("#file").click());
  $("#file").addEventListener("change",ev=>{
    const f=ev.target.files[0]; if(!f) return;
    f.text().then(t=>loadData(JSON.parse(t),f.name)).catch(e=>alert("Bad JSON: "+e.message));
    ev.target.value="";
  });
  $("#demo").addEventListener("click",()=>loadData(DEMO));
  $("#export").addEventListener("click",()=>{
    const b=worldBBox(G,chainCtx), pad=80;
    const clone=svg.cloneNode(true);
    clone.setAttribute("viewBox",`${b.x-pad} ${b.y-pad} ${b.w+2*pad} ${b.h+2*pad}`);
    clone.setAttribute("width",b.w+2*pad); clone.setAttribute("height",b.h+2*pad);
    clone.querySelector("#world").setAttribute("transform","");
    clone.querySelector("#hud").setAttribute("transform",
      `translate(${b.x-pad+10},${b.y-pad+10})`);
    clone.insertAdjacentHTML("afterbegin",
      `<rect x="${b.x-pad}" y="${b.y-pad}" width="${b.w+2*pad}" height="${b.h+2*pad}" fill="#10141c"/>`);
    const blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+clone.outerHTML],
      {type:"image/svg+xml"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(G.meta.program||"bb_graph").replace(/[^\w.-]+/g,"_")+".svg";
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  });
  ["dragover","dragenter"].forEach(t=>addEventListener(t,ev=>{
    ev.preventDefault(); $("#drop").classList.add("on"); }));
  ["dragleave","drop"].forEach(t=>addEventListener(t,ev=>{
    ev.preventDefault(); if(t==="dragleave"&&ev.relatedTarget)return;
    $("#drop").classList.remove("on"); }));
  addEventListener("drop",ev=>{
    const f=ev.dataTransfer.files&&ev.dataTransfer.files[0]; if(!f) return;
    f.text().then(t=>loadData(JSON.parse(t),f.name)).catch(e=>alert("Bad JSON: "+e.message));
  });

  const inj=document.getElementById("bb-data").textContent.trim();
  loadData(inj?JSON.parse(inj):DEMO);
}
if (typeof document!=="undefined") addEventListener("DOMContentLoaded",boot);
</script>
</body>
